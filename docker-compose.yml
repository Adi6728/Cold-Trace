version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: coldchain-trace-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-coldchain_trace}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-coldchain_trace}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  mosquitto:
    image: eclipse-mosquitto:2
    container_name: coldchain-trace-mosquitto
    ports:
      - "1883:1883"
    command: mosquitto -c /mosquitto-no-auth.conf
    # We use a simple config overriding auth for local dev
    environment:
      - TZ=UTC

volumes:
  postgres_data:
